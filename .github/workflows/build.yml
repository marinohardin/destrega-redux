# Builds the runtime on Windows and Linux and runs the unit tests that need no game data.
#
# CI has no disc (game data is never in the repository), so there is no generated code
# (gen/ comes from disc/SLUS_007.32). DESTREGA_STUB_GEN=ON links the runtime against
# tools/ci/stub_gen instead: every runtime source compiles and the executable links and
# starts (--help, "no data pack" error), but it cannot run the game. The tests:
#   gte gpu hires pgxp spu mdec memcard   module unit tests (as in tools/run_tests.sh)
#   hires_gpu                             GPU backend vs software on random command streams;
#                                         Linux: Vulkan on Mesa lavapipe (software Vulkan) under
#                                         Xvfb; Windows: the default API (Direct3D 12: the runner
#                                         has only Microsoft's software adapter, WARP, if any) and
#                                         Vulkan (no driver: the backend must refuse cleanly,
#                                         exit 77 = skip), plus the API switch test (CTest); WARP: ~10 min
#   shaders                               runtime/shaders/hires.glsl compiles and validates
#                                         (SPIR-V), runtime/shaders/hires_dxil.h was generated
#                                         from it, and it still compiles to signed DXIL with
#                                         Microsoft's DXC (Linux release, downloaded)
#
# Each OS job also packages the STUB build with tools/package_release.sh (proves packaging works:
# app bundle / DLL collection, licence files, version resources) and uploads it as
# STUB-NOT-PLAYABLE-<os>: no game code, cannot run the game, kept 3 days. Real (playable)
# builds contain code translated from a disc and are never made or published by CI; see
# "Releases" in AGENTS.md.
#
# Network robustness: downloads retry with backoff (and fall back to libsdl.org, the official
# mirror), the SDL3 build and the MSYS2 packages are cached, and setup-msys2 is retried once.
name: build

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

env:
  SDL_VERSION: 3.4.18
  SDL_CACHE_REV: 1   # bump to invalidate every cached SDL3 build

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MSYS2 CLANG64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tools/version.py counts commits
      # setup-msys2 downloads the MSYS2 installer from GitHub; a 504 there failed a run once.
      # Try twice (the second attempt only runs if the first failed).
      - name: Set up MSYS2
        id: msys_a
        continue-on-error: true
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          cache: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-llvm
      - name: Set up MSYS2 (retry)
        if: steps.msys_a.outcome == 'failure'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          cache: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-llvm
      - name: Configure
        run: |
          pacman -Q mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-clang
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDESTREGA_STUB_GEN=ON -DDESTREGA_TESTS=ON
      - name: Build
        run: cmake --build build/ci -j4
      - name: Unit tests
        run: ctest --test-dir build/ci --output-on-failure -V
      - name: GPU test, Vulkan explicitly (CTest hires_gpu already ran Direct3D 12 = auto, and the switch)
        run: |
          set +e
          for d in vulkan; do
            echo "== test_hires_gpu $d"
            ./build/ci/test_hires_gpu.exe $d > hg_$d.txt 2>&1
            rc=$?
            grep -v "px compared, 0 differ" hg_$d.txt | head -20
            echo "exit $rc"
            if [ $rc != 0 ] && [ $rc != 77 ]; then exit $rc; fi
          done
          exit 0
      - name: GPU test on Mesa lavapipe (software Vulkan for Windows, if MSYS2 ships it)
        run: |
          pacman -S --noconfirm --needed mingw-w64-clang-x86_64-mesa mingw-w64-clang-x86_64-vulkan-loader || exit 0
          icd=$(find /clang64 -iname '*lvp*icd*.json' | head -1)
          if [ -z "$icd" ]; then echo "no lavapipe ICD in MSYS2's mesa; skipped"; pacman -Ql mingw-w64-clang-x86_64-mesa | grep -i vulkan || true; exit 0; fi
          echo "lavapipe ICD: $icd"
          export VK_DRIVER_FILES=$(cygpath -w "$icd")
          # MSYS2's loader is libvulkan-1.dll; SDL looks for vulkan-1.dll
          lib=$(ls /clang64/bin/*vulkan-1.dll | head -1)
          echo "Vulkan loader: $lib"
          export SDL_VULKAN_LIBRARY=$(cygpath -w "$lib")
          set +e
          ./build/ci/test_hires_gpu.exe vulkan
          rc=$?
          if [ $rc = 77 ]; then echo "lavapipe not usable by SDL_GPU here; skipped"; exit 0; fi
          exit $rc
      - name: Executable starts
        run: |
          ./build/ci/destrega.exe --help | head -3
          set +e
          ./build/ci/destrega.exe --headless --frames 10 --data-dir "$RUNNER_TEMP/nodata" > out.txt 2>&1
          rc=$?
          set -e
          cat out.txt
          test $rc = 1 && grep -q "no data pack" out.txt
          ldd ./build/ci/destrega.exe | grep -iv "windows\\\\system32" || true
      - name: Package the stub build
        run: tools/package_release.sh win --exe build/ci/destrega.exe
      - uses: actions/upload-artifact@v4
        with:
          name: STUB-NOT-PLAYABLE-windows
          path: dist/Destrega-STUB-NOT-PLAYABLE-*
          retention-days: 3
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [clang, gcc]
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang zlib1g-dev pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libegl-dev libgl-dev libasound2-dev libpulse-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools xvfb glslang-tools spirv-tools
      # Restore is separate from save so a partial (restore-keys) hit still rebuilds and
      # saves under the exact key. Caches made on main are readable from PR branches.
      - name: Restore SDL3 cache
        id: sdl-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-r${{ env.SDL_CACHE_REV }}-ubuntu-24.04
          restore-keys: |
            sdl3-${{ env.SDL_VERSION }}-r${{ env.SDL_CACHE_REV }}-
      - name: Build SDL3 ${{ env.SDL_VERSION }}
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          # GitHub release first, then libsdl.org (the official mirror); each with retries.
          fetch() {
            curl -fsSL --retry 8 --retry-all-errors --retry-max-time 300 --connect-timeout 20 -o sdl.tar.gz "$1"
          }
          fetch https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-$SDL_VERSION.tar.gz \
            || fetch https://libsdl.org/release/SDL3-$SDL_VERSION.tar.gz
          tar xzf sdl.tar.gz
          cmake -S SDL3-$SDL_VERSION -B sdlbuild -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$HOME/sdl3 -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdlbuild
          cmake --install sdlbuild
      - name: Save SDL3 cache
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-r${{ env.SDL_CACHE_REV }}-ubuntu-24.04
      - name: Shaders compile and validate
        run: |
          python3 tools/gen_spirv.py --check
          python3 tools/gen_dxil.py --check-fresh
      - name: DXIL shaders compile with DXC
        if: matrix.cc == 'clang'
        run: |
          sudo apt-get install -y spirv-cross || { echo "no spirv-cross package; skipped"; exit 0; }
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 300 --connect-timeout 20 -o dxc.tar.gz \
            https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/linux_dxc_2026_09_28.x86_x64.tar.gz
          mkdir dxc && tar xzf dxc.tar.gz -C dxc
          DXC="$PWD/dxc/bin/dxc" LD_LIBRARY_PATH="$PWD/dxc/lib" python3 tools/gen_dxil.py --check
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_PREFIX_PATH=$HOME/sdl3 -DDESTREGA_STUB_GEN=ON -DDESTREGA_TESTS=ON
      - name: Build
        run: cmake --build build/ci
      - name: Vulkan devices
        run: xvfb-run -a vulkaninfo --summary || true
      - name: Unit tests (hires_gpu on Mesa lavapipe)
        run: LD_LIBRARY_PATH=$HOME/sdl3/lib xvfb-run -a ctest --test-dir build/ci --output-on-failure -V
      - name: Executable starts
        run: |
          export LD_LIBRARY_PATH=$HOME/sdl3/lib
          ./build/ci/destrega --help | head -3
          set +e
          ./build/ci/destrega --headless --frames 10 --data-dir "$RUNNER_TEMP/nodata" > out.txt 2>&1
          rc=$?
          set -e
          cat out.txt
          test $rc = 1 && grep -q "no data pack" out.txt
      # The launcher layout (docs/RELEASES.md option A) needs no gen/ at all: the executable holds
      # no game code by construction. Built and checked here, never packaged or uploaded.
      - name: Launcher build (no game code)
        run: |
          cmake -S . -B build/launcher -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_PREFIX_PATH=$HOME/sdl3 -DDESTREGA_GAME_MODULE=ON -DDESTREGA_DEV_GAME_MODULE=OFF
          cmake --build build/launcher
          python3 tools/check_no_game_code.py build/launcher/destrega
          LD_LIBRARY_PATH=$HOME/sdl3/lib ./build/launcher/destrega --help | grep -q -- --game-cc

  macos:
    name: macOS (stub app bundle)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencies
        run: |
          for i in 1 2 3 4; do brew install sdl3 ninja && break; echo "brew failed, retry $i"; sleep $((i * 15)); done
          brew list --versions sdl3
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DDESTREGA_STUB_GEN=ON -DDESTREGA_TESTS=ON
      - name: Build (also bundles Destrega.app with tools/make_app.sh)
        run: cmake --build build/ci
      - name: Unit tests
        run: ctest --test-dir build/ci --output-on-failure -V
      - name: Executable starts
        run: |
          ./build/ci/destrega --help | head -3
          set +e
          ./build/ci/destrega --headless --frames 10 --data-dir "$RUNNER_TEMP/nodata" > out.txt 2>&1
          rc=$?
          set -e
          cat out.txt
          test $rc = 1 && grep -q "no data pack" out.txt
      - name: Package the stub build
        run: tools/package_release.sh mac --app build/ci/Destrega.app
      - uses: actions/upload-artifact@v4
        with:
          name: STUB-NOT-PLAYABLE-macos
          path: dist/Destrega-STUB-NOT-PLAYABLE-*
          retention-days: 3
          if-no-files-found: error
